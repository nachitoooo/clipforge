# The `apple-metal` crate (via `screencapturekit`) links Swift code that
# auto-links the Swift compatibility libraries. With only Command Line Tools
# installed, ld does not search their directory by default — add it.
[target.aarch64-apple-darwin]
rustflags = [
    "-C", "link-arg=-L/Library/Developer/CommandLineTools/usr/lib/swift/macosx",
    "-C", "link-arg=-L/usr/lib/swift",
    "-C", "link-arg=-Wl,-rpath,/usr/lib/swift",
]

[target.x86_64-apple-darwin]
rustflags = [
    "-C", "link-arg=-L/Library/Developer/CommandLineTools/usr/lib/swift/macosx",
    "-C", "link-arg=-L/usr/lib/swift",
    "-C", "link-arg=-Wl,-rpath,/usr/lib/swift",
]
