name: Windows probe

# What does a GitHub Windows runner offer for real capture tests? Manual only.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - name: System
        shell: powershell
        run: |
          [Environment]::OSVersion | Format-List
          (Get-CimInstance Win32_OperatingSystem) | Select-Object Caption, Version, BuildNumber | Format-List
          "SESSIONNAME=$env:SESSIONNAME  USERNAME=$env:USERNAME"
          query session 2>&1
          "--- video controllers"
          Get-CimInstance Win32_VideoController | Select-Object Name, AdapterCompatibility, VideoModeDescription, CurrentHorizontalResolution, CurrentVerticalResolution | Format-List
          "--- screens"
          Add-Type -AssemblyName System.Windows.Forms
          [System.Windows.Forms.Screen]::AllScreens | ForEach-Object { "$($_.DeviceName) $($_.Bounds) primary=$($_.Primary)" }
          exit 0
      - name: Media Foundation
        if: always()
        shell: powershell
        run: |
          foreach ($f in "mf.dll","mfplat.dll","mfreadwrite.dll","mfh264enc.dll","mfaacenc.dll","mfcore.dll","msmpeg2enc.dll") {
            $p = Join-Path $env:SystemRoot "System32\$f"
            "{0,-18} {1}" -f $f, (Test-Path $p)
          }
          "--- features"
          Get-WindowsFeature *Media* | Format-Table Name, InstallState -AutoSize
      - name: Graphics capture + audio
        if: always()
        shell: powershell
        run: |
          try {
            [Windows.Graphics.Capture.GraphicsCaptureSession,Windows.Graphics.Capture,ContentType=WindowsRuntime] | Out-Null
            "GraphicsCaptureSession.IsSupported = " + [Windows.Graphics.Capture.GraphicsCaptureSession]::IsSupported()
          } catch { "WGC probe failed: $_" }
          "--- audio"
          Get-Service Audiosrv, AudioEndpointBuilder | Format-Table Name, Status, StartType -AutoSize
          Get-CimInstance Win32_SoundDevice | Select-Object Name, Status | Format-Table -AutoSize
          "--- tools"
          Get-Command ffmpeg, ffprobe -ErrorAction SilentlyContinue | Select-Object Name, Source | Format-Table -AutoSize
