name: Windows probe

# What does a GitHub Windows runner offer for real capture tests? Manual only.
on:
  workflow_dispatch:

jobs:
  audio:
    runs-on: windows-latest
    steps:
      - name: Audio endpoints before
        shell: powershell
        run: |
          Get-PnpDevice -Class AudioEndpoint -ErrorAction SilentlyContinue | Format-Table FriendlyName, Status -AutoSize
          Get-CimInstance Win32_SoundDevice | Format-Table Name, Status -AutoSize
          exit 0
      - name: Install a virtual audio cable
        shell: powershell
        run: |
          choco install vb-cable -y --no-progress 2>&1 | Select-Object -Last 25
          exit 0
      - name: Run the driver setup
        shell: powershell
        run: |
          $dir = "C:\ProgramData\chocolatey\lib\vb-cable\tools"
          Get-ChildItem $dir | Format-Table Name, Length
          # Trust the publisher first, or Windows asks "install this device software?"
          # in a window nobody can click.
          $cat = Get-ChildItem $dir -Filter "*.cat" | Select-Object -First 1
          $sig = Get-AuthenticodeSignature $cat.FullName
          "catalog: $($cat.Name) signed by $($sig.SignerCertificate.Subject)"
          $store = New-Object System.Security.Cryptography.X509Certificates.X509Store("TrustedPublisher","LocalMachine")
          $store.Open("ReadWrite"); $store.Add($sig.SignerCertificate); $store.Close()
          $p = Start-Process -FilePath "$dir\VBCABLE_Setup_x64.exe" -ArgumentList "-i","-h" -PassThru
          if (-not $p.WaitForExit(90000)) { "setup still running after 90 s: killing it"; Stop-Process -Id $p.Id -Force }
          else { "setup exit code: $($p.ExitCode)" }
          exit 0
      - name: Audio endpoints after
        shell: powershell
        run: |
          Start-Sleep -Seconds 8
          Get-PnpDevice -Class AudioEndpoint -ErrorAction SilentlyContinue | Format-Table FriendlyName, Status -AutoSize
          Get-CimInstance Win32_SoundDevice | Format-Table Name, Status -AutoSize
          Get-Service Audiosrv | Format-Table Name, Status
          exit 0
