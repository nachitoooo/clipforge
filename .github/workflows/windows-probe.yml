name: Windows probe

# What does a GitHub Windows runner offer for real capture tests? Manual only.
on:
  workflow_dispatch:

jobs:
  audio:
    runs-on: windows-latest
    steps:
      - name: Audio endpoints before
        shell: powershell
        run: |
          Get-PnpDevice -Class AudioEndpoint -ErrorAction SilentlyContinue | Format-Table FriendlyName, Status -AutoSize
          Get-CimInstance Win32_SoundDevice | Format-Table Name, Status -AutoSize
          exit 0
      - name: Install a virtual audio cable
        shell: powershell
        run: |
          choco install vb-cable -y --no-progress 2>&1 | Select-Object -Last 25
          exit 0
      - name: Audio endpoints after
        shell: powershell
        run: |
          Start-Sleep -Seconds 8
          Get-PnpDevice -Class AudioEndpoint -ErrorAction SilentlyContinue | Format-Table FriendlyName, Status -AutoSize
          Get-CimInstance Win32_SoundDevice | Format-Table Name, Status -AutoSize
          Get-Service Audiosrv | Format-Table Name, Status
          exit 0
