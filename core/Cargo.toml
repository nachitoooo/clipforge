[package]
name = "clipforge-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ClipForge core engine: capture, encode, ring buffer, clip extraction"

[dependencies]
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
mp4 = "0.14"
symphonia = { version = "0.5", default-features = false, features = ["aac"] }
thiserror = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-cf = { version = "0.9", default-features = false, features = ["cm", "cv", "iosurface"] }
# macos_14_0: SCScreenshotManager, for the screenshots (macOS 14+ at run time).
screencapturekit = { version = "8.0", features = ["macos_14_0"] }
videotoolbox = "0.18"
# Already in the tree through Tauri; only the two classes the foreground-app
# lookup needs.
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWorkspace", "NSRunningApplication", "NSPasteboard"] }
# Likewise already in the tree: the types the pasteboard call passes around.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSString", "NSURL"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
cpal = "0.18"

[target.'cfg(target_os = "windows")'.dependencies]
png = "0.17"
windows = { version = "0.62", features = [
    "Foundation",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Performance",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_Storage_FileSystem",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
mp4 = "0.14"
tokio = { version = "1", features = ["full", "test-util"] }
